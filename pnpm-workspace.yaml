packages:
  - "apps/*"
  - "packages/*"
  - "qa"

allowBuilds:
  "@firebase/util": false
  protobufjs: false
  # Firebase CLI can run without the optional native acceleration. Keep its
  # network/build install script disabled to reduce supply-chain surface.
  re2: false
  # Its postinstall may prepare/download a native binary; the optional platform
  # package is sufficient for our lint workflow, so execution stays blocked.
  unrs-resolver: false

overrides:
  nanoid: 3.3.18
  # get-uri's Client API is unchanged; v6 also rejects FTP bounce hosts by default.
  "get-uri>basic-ftp": 6.2.2
  "proxy-addr@<2.0.8": 2.0.8
  "qs@<6.16.0": 6.16.0
  "@fastify/busboy@>=3 <3.2.2": 3.2.2
  "@grpc/grpc-js@>=1 <1.14.5": 1.14.5
  "sharp@>=0.35 <0.35.5": 0.35.5
  "brace-expansion@>=1 <1.1.21": 1.1.21
  "brace-expansion@>=2 <2.1.7": 2.1.7
  "brace-expansion@>=5 <5.0.12": 5.0.12
  "source-map-js@<1.2.2": 1.2.2
  "compression@<1.8.2": 1.8.2
  "morgan@<1.12.1": 1.12.1
  "hono@>=4 <4.13.7": 4.13.7
  "ip-address@>=10 <10.7.1": 10.7.1
  "undici@>=6 <6.28.1": 6.28.1
  "undici@>=8 <8.10.2": 8.10.2
  "@modelcontextprotocol/sdk@>=1 <1.31.0": 1.31.0

catalog:
  zod: 4.4.3
